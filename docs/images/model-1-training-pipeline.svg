<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">Paragraph humanizer</title><desc id="desc">Qwen3 1.7B · supervised fine-tuning · MLX on an M4 MacBook</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#2563eb"/></marker></defs><rect width="1600" height="1080" fill="#f3f6fb"/><g font-family="Arial, Helvetica, sans-serif"><rect width="1600" height="164" fill="#14243b"/><text x="60" y="49" font-size="16" fill="#93c5fd" font-weight="700">MODEL 1   /   TRAINING PIPELINE</text><text x="60" y="98" font-size="40" fill="#ffffff" font-weight="700">Paragraph humanizer</text><text x="60" y="135" font-size="21" fill="#cbd5e1" font-weight="400">Qwen3 1.7B · supervised fine-tuning · MLX on an M4 MacBook</text><rect x="60" y="210" width="465" height="175" rx="18" fill="#ffffff" stroke="#dce4ee"/><text x="85" y="243" font-size="15" fill="#2563eb" font-weight="700">01  ·  DATA PREPARATION</text><text x="85" y="280" font-size="25" fill="#14243b" font-weight="700">Academic source prose</text><text x="85" y="316" font-size="20" fill="#536277" font-weight="400">Textbooks, research and book PDFs</text><text x="85" y="345" font-size="20" fill="#536277" font-weight="400">Extract prose; omit code fragments.</text><path d="M526,297 L560,297" fill="none" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow)"/><rect x="565" y="210" width="465" height="175" rx="18" fill="#ffffff" stroke="#dce4ee"/><text x="590" y="243" font-size="15" fill="#2563eb" font-weight="700">02  ·  DATA PREPARATION</text><text x="590" y="280" font-size="25" fill="#14243b" font-weight="700">Humanizer B rewrite pairs</text><text x="590" y="316" font-size="20" fill="#536277" font-weight="400">Original paragraph → humanized target</text><text x="590" y="345" font-size="20" fill="#536277" font-weight="400">Save exact before / after text.</text><path d="M1031,297 L1065,297" fill="none" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1070" y="210" width="465" height="175" rx="18" fill="#ffffff" stroke="#dce4ee"/><text x="1095" y="243" font-size="15" fill="#2563eb" font-weight="700">03  ·  DATA PREPARATION</text><text x="1095" y="280" font-size="25" fill="#14243b" font-weight="700">Detector annotations</text><text x="1095" y="316" font-size="20" fill="#536277" font-weight="400">Detector A · three other detectors</text><text x="1095" y="345" font-size="20" fill="#536277" font-weight="400">Missing score → null + retry reason.</text><path d="M1302,386 L1302,428" fill="none" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1060" y="440" width="480" height="176" rx="18" fill="#ffffff" stroke="#dce4ee"/><text x="1085" y="473" font-size="15" fill="#2563eb" font-weight="700">04  ·  GROUPED 80 / 20 SPLIT</text><text x="1085" y="510" font-size="25" fill="#14243b" font-weight="700">Separate task dataset</text><text x="1085" y="546" font-size="20" fill="#536277" font-weight="400">891 training pairs → train.jsonl</text><text x="1085" y="575" font-size="20" fill="#536277" font-weight="400">223 validation pairs → valid.jsonl</text><text x="1085" y="604" font-size="20" fill="#536277" font-weight="400">Related examples stay together.</text><path d="M1060,530 L1002,530" fill="none" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow)"/><rect x="550" y="440" width="440" height="176" rx="18" fill="#2563eb" stroke="#2563eb"/><text x="575" y="473" font-size="15" fill="#dbeafe" font-weight="700">05  ·  OPTIMIZATION</text><text x="575" y="510" font-size="25" fill="#ffffff" font-weight="700">Train on Apple Silicon</text><text x="575" y="546" font-size="20" fill="#eff6ff" font-weight="400">4-bit base + LoRA rank 8 / 8 layers</text><text x="575" y="575" font-size="20" fill="#eff6ff" font-weight="400">Assistant-token cross-entropy</text><path d="M550,530 L498,530" fill="none" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow)"/><rect x="60" y="440" width="425" height="176" rx="18" fill="#ffffff" stroke="#dce4ee"/><text x="85" y="473" font-size="15" fill="#2563eb" font-weight="700">06  ·  SAVED ARTIFACTS</text><text x="85" y="510" font-size="25" fill="#14243b" font-weight="700">Checkpoint the model</text><text x="85" y="546" font-size="20" fill="#536277" font-weight="400">Adapter snapshots every 100 steps</text><text x="85" y="575" font-size="20" fill="#536277" font-weight="400">Continue from saved adapter weights.</text><path d="M770,617 L770,714" fill="none" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1300,617 L1300,755 L1050,755" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="1130" y="696" font-size="15" fill="#2563eb" font-weight="700">HELD-OUT VALIDATION</text><rect x="550" y="726" width="500" height="167" rx="18" fill="#ffffff" stroke="#dce4ee"/><text x="575" y="759" font-size="15" fill="#2563eb" font-weight="700">07  ·  EVALUATION</text><text x="575" y="796" font-size="25" fill="#14243b" font-weight="700">Measure generalization</text><text x="575" y="832" font-size="20" fill="#536277" font-weight="400">Training + validation loss → W&amp;B</text><text x="575" y="861" font-size="20" fill="#536277" font-weight="400">Loss curves and saved evaluation results</text><path d="M550,806 L498,806" fill="none" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow)"/><rect x="60" y="726" width="425" height="167" rx="18" fill="#ffffff" stroke="#dce4ee"/><text x="85" y="759" font-size="15" fill="#2563eb" font-weight="700">08  ·  INFERENCE</text><text x="85" y="796" font-size="25" fill="#14243b" font-weight="700">Use the trained model</text><text x="85" y="832" font-size="20" fill="#536277" font-weight="400">Original paragraph → rewrite</text><text x="85" y="861" font-size="20" fill="#536277" font-weight="400">Load the saved model artifacts.</text><text x="60" y="967" font-size="15" fill="#2563eb" font-weight="700">READING THE DIAGRAM</text><text x="60" y="1000" font-size="20" fill="#334155" font-weight="400">Solid arrows: data / model flow     ·     Dashed arrow: held-out evaluation</text><text x="60" y="1040" font-size="18" fill="#334155" font-weight="400">Detector scores are metadata; Humanizer B rewrites are the training targets. MLX does not restore optimizer state.</text></g></svg>